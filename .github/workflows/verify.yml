name: Verify mobile

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type, test, audit and export
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Use the declared npm version
        run: npm install --global npm@10.9.2

      - name: Install locked dependencies
        run: npm ci

      - name: Verify generated brand assets
        run: npm run brand:check

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Check Expo dependency health
        run: npx expo-doctor --verbose

      - name: Reject high-severity dependency findings
        run: npm audit --audit-level=high

      - name: Export web preview
        run: npm run build

      - name: Upload web preview artifact
        uses: actions/upload-artifact@v7
        with:
          name: mobile-web-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
